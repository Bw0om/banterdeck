# Sjekker at iPhone-appen kompilerer, og tar skjermbilder av den i simulatoren.
# Ingen signering, ingenting til TestFlight – bare et bygg på GitHub sin Mac, så Swift-koden kan
# skrives og rettes fra en Windows-maskin uten å bruke opp TestFlight-bygg.
# Kjøres av seg selv på greiner som heter swift/… og ellers når du trykker «Run workflow».
name: iPhone-app sjekk (simulator)

on:
  workflow_dispatch:
  push:
    branches: ['swift/**']
    paths: ['ios/**', 'src/**', 'capacitor.config.json', '.github/workflows/ios-sjekk.yml']

jobs:
  sjekk:
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Nyeste Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pakker
        run: npm install --no-audit --no-fund --no-save
      - name: Bygger sidene inn i appen
        run: |
          for i in $(seq 1 10); do OPPSETT=$(curl -fsS https://www.mittvors.no/api/oppsett) && break; sleep 30; done
          [ -n "$OPPSETT" ] || { echo "Fikk ikke oppsettet fra mittvors.no"; exit 1; }
          export PUBLIC_SUPABASE_URL=$(node -pe 'JSON.parse(process.argv[1]).url' "$OPPSETT")
          export PUBLIC_SUPABASE_ANON_KEY=$(node -pe 'JSON.parse(process.argv[1]).anon' "$OPPSETT")
          export MV_UTVIKLING=0   # simulatoren har ingen kode til porten før lansering – bygg uten den
          npm run build:app
      - name: Kopierer sidene inn i iOS-prosjektet
        run: npx cap sync ios
      - name: Maestro (trykker på knappene i simulatoren)
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Velger en iPhone i simulatoren
        id: sim
        run: |
          # Den nyeste vanlige iPhonen som finnes på maskinen (ikke Pro Max, ikke SE)
          UDID=$(xcrun simctl list devices available -j | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const alle = Object.values(d).flat().filter(x => /^iPhone \d+$/.test(x.name) && x.isAvailable);
            alle.sort((a, b) => parseInt(b.name.match(/\d+/)[0]) - parseInt(a.name.match(/\d+/)[0]));
            (alle[0] || Object.values(d).flat().find(x => /iPhone/.test(x.name))).udid')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Kompilerer for simulatoren
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: .*\.swift|BUILD|Compiling" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Starter appen og tar skjermbilder
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Norsk, som på eierens telefon (språket leses når appen starter – telefonen må startes på nytt etter byttet)
          xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLanguages -array nb-NO
          xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLocale -string nb_NO
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim/Build/Products -name "App.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p skjermbilder
          # Flytene i ios/sjekk-flyt/ trykker på knappene og tar bilder underveis (Maestro). Feiler en flyt, går sjekken videre –
          # bildene fram til feilen og loggen (maestro.txt) ligger i ios/sjekk/.
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=600000 MAESTRO_CLI_NO_ANALYTICS=1
          BILDER="$PWD/skjermbilder"
          # Bildene i flytene heter ../../skjermbilder/… – det treffer uansett om Maestro regner fra flytfila eller fra mappa vi står i
          flyt() { echo "===== $1 =====" >> skjermbilder/maestro.txt; (cd ios/sjekk-flyt && maestro --udid "$UDID" test ${2:+-e "$3"} "$1.yaml" --debug-output "$BILDER/maestro-logg/$1" 2>&1 | tee -a "$BILDER/maestro.txt") || echo "FLYT $1 FEILET" >> skjermbilder/maestro.txt; }
          SIMCTL_CHILD_MV_SJEKK=1 xcrun simctl launch "$UDID" no.mittvors.app
          sleep 12
          xcrun simctl io "$UDID" screenshot skjermbilder/01-spill.png
          # Første Maestro-kjøring bygger og installerer testdriveren (tar et par minutter): varm opp med en tom flyt først
          flyt varm
          flyt varm   # en gang til om driveren ikke rakk å starte første gang (rask når den er oppe)
          flyt spill
          # Én start per fane: appen leser MV_FANE og velger fanen selv (Skall.swift)
          for f in leker deg; do
            xcrun simctl terminate "$UDID" no.mittvors.app || true
            SIMCTL_CHILD_MV_SJEKK=1 SIMCTL_CHILD_MV_FANE=$f xcrun simctl launch "$UDID" no.mittvors.app
            sleep 12
            xcrun simctl io "$UDID" screenshot "skjermbilder/02-$f.png"
            flyt $f
          done
          # Tre spillere: verten og en gjest lages rett mot API-et, appen blir med på koden, og verten starter Ukjent avsender
          API=https://www.mittvors.no/api/rom
          R=$(curl -fsS -X POST "$API" -H 'content-type: application/json' -d '{"navn":"Vert","lang":"no"}' || echo '{}')
          KODE=$(node -pe 'JSON.parse(process.argv[1]).kode || ""' "$R"); VID=$(node -pe 'JSON.parse(process.argv[1]).id || ""' "$R"); VPOL=$(node -pe 'JSON.parse(process.argv[1]).pollett || ""' "$R")
          echo "rom for flere: $KODE" >> skjermbilder/maestro.txt
          if [ -n "$KODE" ]; then
            curl -fsS -X POST "$API/$KODE" -H 'content-type: application/json' -d '{"handling":"bli-med","navn":"Gjest","lang":"no"}' > /dev/null || true
            # Appen installeres på nytt, så den står på forsiden (ikke i rommet fra Spill-flyten). Loggen så langt tas vare på først.
            xcrun simctl terminate "$UDID" no.mittvors.app || true
            DATA=$(xcrun simctl get_app_container "$UDID" no.mittvors.app data 2>/dev/null || true)
            [ -n "$DATA" ] && cat "$DATA/Documents/sjekk.log" >> skjermbilder/sjekk-1.log 2>/dev/null || true
            xcrun simctl uninstall "$UDID" no.mittvors.app || true
            xcrun simctl install "$UDID" "$APP"
            SIMCTL_CHILD_MV_SJEKK=1 xcrun simctl launch "$UDID" no.mittvors.app
            sleep 12
            echo "===== flere =====" >> skjermbilder/maestro.txt
            flyt flere -e KODE="$KODE"
            curl -fsS -X POST "$API/$KODE" -H 'content-type: application/json' -d "{\"handling\":\"start\",\"lek\":\"hvemskrev\",\"modus\":\"*\",\"id\":\"$VID\",\"pollett\":\"$VPOL\"}" > /dev/null || echo "fikk ikke startet Ukjent avsender" >> skjermbilder/maestro.txt
            flyt flere2
          fi
          xcrun simctl terminate "$UDID" no.mittvors.app || true
          SIMCTL_CHILD_MV_SJEKK=1 SIMCTL_CHILD_MV_MORK=1 xcrun simctl launch "$UDID" no.mittvors.app
          sleep 12
          xcrun simctl io "$UDID" screenshot skjermbilder/04-spill-mork.png
          # Loggen nettsiden skrev (JavaScript-feil og tilstand) ligger i appens Documents
          DATA=$(xcrun simctl get_app_container "$UDID" no.mittvors.app data 2>/dev/null || true)
          { cat skjermbilder/sjekk-1.log 2>/dev/null; echo "----- etter ny installasjon -----"; [ -n "$DATA" ] && cat "$DATA/Documents/sjekk.log" 2>/dev/null; } > skjermbilder/sjekk.log
          xcrun simctl spawn "$UDID" log show --predicate 'process == "App"' --last 2m --style compact > skjermbilder/app-logg.txt 2>/dev/null || true
          # Flytenes egne bilder (NN-navn.png) ligger der Maestro la dem (ved flytfila eller i loggmappa); Maestro tar dessuten
          # selv et bilde når et steg feiler – de tas med som feil-<flyt>-N.png
          find ios/sjekk-flyt -maxdepth 1 -name "[0-9][0-9]-*.png" -exec mv {} skjermbilder/ \; 2>/dev/null || true
          for f in skjermbilder/maestro-logg/*/; do n=$(basename "$f"); i=0; find "$f" -name "*.png" | sort | while read -r b; do case "$(basename "$b")" in [0-9][0-9]-*) cp "$b" skjermbilder/;; *) i=$((i+1)); cp "$b" "skjermbilder/feil-$n-$i.png";; esac; done; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skjermbilder
          path: |
            skjermbilder/
            build/xcodebuild.log
          if-no-files-found: ignore
      - name: Legger skjermbildene og feilene tilbake på greinen (ios/sjekk/)
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p ios/sjekk && rm -f ios/sjekk/*
          cp skjermbilder/*.png skjermbilder/sjekk.log skjermbilder/maestro.txt ios/sjekk/ 2>/dev/null || true
          { grep -E "error:|BUILD (SUCCEEDED|FAILED)" build/xcodebuild.log; echo "----- siste linjer -----"; grep -vE "^\s+(cd |builtin-|/Applications)" build/xcodebuild.log | tail -15; echo "----- skjemaer -----"; xcodebuild -list -project ios/App/App.xcodeproj 2>&1 | tail -20; } > ios/sjekk/bygg.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/sjekk && (git diff --cached --quiet || git commit -m "Simulator-sjekk: skjermbilder og byggresultat [skip ci]") && git push || true
