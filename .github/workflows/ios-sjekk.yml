# Sjekker at iPhone-appen kompilerer, og tar skjermbilder av den i simulatoren.
# Ingen signering, ingenting til TestFlight – bare et bygg på GitHub sin Mac, så Swift-koden kan
# skrives og rettes fra en Windows-maskin uten å bruke opp TestFlight-bygg.
# Kjøres av seg selv på greiner som heter swift/… og ellers når du trykker «Run workflow».
name: iPhone-app sjekk (simulator)

on:
  workflow_dispatch:
  push:
    branches: ['swift/**']
    paths: ['ios/**', 'src/klient/app.js', 'capacitor.config.json', '.github/workflows/ios-sjekk.yml']

jobs:
  sjekk:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Nyeste Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pakker
        run: npm install --no-audit --no-fund --no-save
      - name: Bygger sidene inn i appen
        run: |
          for i in $(seq 1 10); do OPPSETT=$(curl -fsS https://www.mittvors.no/api/oppsett) && break; sleep 30; done
          [ -n "$OPPSETT" ] || { echo "Fikk ikke oppsettet fra mittvors.no"; exit 1; }
          export PUBLIC_SUPABASE_URL=$(node -pe 'JSON.parse(process.argv[1]).url' "$OPPSETT")
          export PUBLIC_SUPABASE_ANON_KEY=$(node -pe 'JSON.parse(process.argv[1]).anon' "$OPPSETT")
          export MV_UTVIKLING=0   # simulatoren har ingen kode til porten før lansering – bygg uten den
          npm run build:app
      - name: Kopierer sidene inn i iOS-prosjektet
        run: npx cap sync ios
      - name: Velger en iPhone i simulatoren
        id: sim
        run: |
          # Den nyeste vanlige iPhonen som finnes på maskinen (ikke Pro Max, ikke SE)
          UDID=$(xcrun simctl list devices available -j | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const alle = Object.values(d).flat().filter(x => /^iPhone \d+$/.test(x.name) && x.isAvailable);
            alle.sort((a, b) => parseInt(b.name.match(/\d+/)[0]) - parseInt(a.name.match(/\d+/)[0]));
            (alle[0] || Object.values(d).flat().find(x => /iPhone/.test(x.name))).udid')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Kompilerer for simulatoren
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: .*\.swift|BUILD|Compiling" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Starter appen og tar skjermbilder
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim/Build/Products -name "App.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p skjermbilder
          xcrun simctl launch "$UDID" no.mittvors.app
          sleep 12
          xcrun simctl io "$UDID" screenshot skjermbilder/01-hjem.png
          # Én start per fane: appen leser MV_FANE og velger fanen selv (Skall.swift)
          for f in spill leker deg; do
            xcrun simctl terminate "$UDID" no.mittvors.app || true
            SIMCTL_CHILD_MV_FANE=$f xcrun simctl launch "$UDID" no.mittvors.app
            sleep 12
            xcrun simctl io "$UDID" screenshot "skjermbilder/02-$f.png"
          done
          xcrun simctl spawn "$UDID" log show --predicate 'process == "App"' --last 2m --style compact > skjermbilder/app-logg.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skjermbilder
          path: |
            skjermbilder/
            build/xcodebuild.log
          if-no-files-found: ignore
      - name: Legger skjermbildene og feilene tilbake på greinen (ios/sjekk/)
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p ios/sjekk && rm -f ios/sjekk/*
          cp skjermbilder/*.png ios/sjekk/ 2>/dev/null || true
          { grep -E "error:|BUILD (SUCCEEDED|FAILED)" build/xcodebuild.log; echo "----- siste linjer -----"; grep -vE "^\s+(cd |builtin-|/Applications)" build/xcodebuild.log | tail -15; echo "----- skjemaer -----"; xcodebuild -list -project ios/App/App.xcodeproj 2>&1 | tail -20; } > ios/sjekk/bygg.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/sjekk && (git diff --cached --quiet || git commit -m "Simulator-sjekk: skjermbilder og byggresultat [skip ci]") && git push || true
