# Simulator-sjekken: verten (jobben) har startet Ukjent avsender med tre spillere – skriveknappen, iPhone-dialogen og «Mer» i leken.
appId: no.mittvors.app
env:
  BILDER: "skjermbilder"
---
- extendedWaitUntil:
    visible:
      text: "(?is)send anonymt.*"
    timeout: 40000
- takeScreenshot: ${BILDER}/42-ukjent-avsender
- tapOn:
    text: "(?is)send anonymt.*"
- waitForAnimationToEnd
- takeScreenshot: ${BILDER}/43-skrivedialog
- inputText: "Et svar fra sjekken"
- takeScreenshot: ${BILDER}/44-skrivedialog-fylt
# Dialogens knapp heter det samme som knappen under: ta den som ligger til høyre for (eller over) «Avbryt»
- tapOn:
    text: "(?is)send anonymt.*"
    rightOf:
      text: "Avbryt"
    optional: true
- tapOn:
    text: "(?is)send anonymt.*"
    above:
      text: "Avbryt"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${BILDER}/45-sendt
- tapOn:
    text: "Mer"
- extendedWaitUntil:
    visible:
      text: "Lukk"
    timeout: 10000
- takeScreenshot: ${BILDER}/46-mer-i-leken
- tapOn:
    text: "Lukk"
- waitForAnimationToEnd
- takeScreenshot: ${BILDER}/47-tilbake-i-leken
