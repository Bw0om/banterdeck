# Simulator-sjekken: Leker-fanen – alderssjekken, lista, filtrene, den native lekesiden (regler, kopier, tilbake),
# og en lekeside med kortbunke («Bare én telefon» → nettsiden → «Reglene» tilbake).
appId: no.mittvors.app
---
# Alderssjekken (iPhone-dialog) kommer et øyeblikk etter lista
- extendedWaitUntil:
    visible:
      text: "(?is)ja, jeg er over 18.*"
    timeout: 8000
    optional: true
- tapOn:
    text: "(?is)ja, jeg er over 18.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 20-leker
- tapOn:
    text: "I appen"
- waitForAnimationToEnd
- takeScreenshot: 21-leker-i-appen
- tapOn:
    text: "Alle"
- waitForAnimationToEnd
- tapOn:
    text: "(?is)muldvarpen.*"
# Lekesiden er native: reglene står på skjermen
- extendedWaitUntil:
    visible:
      text: "Slik spiller dere"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 22-lekeside
- assertVisible:
    text: "(?is)spill i rommet"
# Kopier-knappen ligger under reglene: sveip opp først
- swipe:
    start: 50%, 85%
    end: 50%, 25%
    duration: 600
- waitForAnimationToEnd
- swipe:
    start: 50%, 85%
    end: 50%, 25%
    duration: 600
- waitForAnimationToEnd
- tapOn:
    text: "(?is)kopier reglene"
- waitForAnimationToEnd
# Tilbake-knappen rullet ut av bildet: sveip ned igjen
- swipe:
    start: 50%, 25%
    end: 50%, 85%
    duration: 600
- waitForAnimationToEnd
- swipe:
    start: 50%, 25%
    end: 50%, 85%
    duration: 600
- waitForAnimationToEnd
- tapOn:
    text: "Tilbake"
# Lista kommer tilbake fra hurtigminnet
- extendedWaitUntil:
    visible:
      text: "(?is)spill fra hver sin telefon"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 23-leker-tilbake
# En lek med kortbunke på én telefon: Over eller under
- tapOn:
    text: "(?is)over eller under.*"
- extendedWaitUntil:
    visible:
      text: "Slik spiller dere"
    timeout: 20000
# «Bare én telefon» når rommet finnes, ellers «Start leken»
- tapOn:
    text: "(?is)(bare én telefon|start leken).*"
# Nettsidens kortbunke tar over, med raden «Reglene» øverst
- extendedWaitUntil:
    visible:
      text: "(?is)reglene"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 24-lekeside-kortbunke
- tapOn:
    text: "(?is)reglene"
- extendedWaitUntil:
    visible:
      text: "Slik spiller dere"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 25-lekeside-igjen
- tapOn:
    text: "Tilbake"
- waitForAnimationToEnd
