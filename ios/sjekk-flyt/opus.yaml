# Simulator-sjekken: verten (jobben) har startet Opus og har terningen – appen ser terningen, og at den lander når verten triller (OpusSkjerm.swift).
appId: no.mittvors.app
---
- extendedWaitUntil:
    visible:
      text: "(?is)vi er klare.*"
    timeout: 40000
- waitForAnimationToEnd
- tapOn:
    text: "(?is)vi er klare.*"
- waitForAnimationToEnd
- tapOn:
    text: "(?is)vi er klare.*"
    optional: true
- extendedWaitUntil:
    visible:
      text: "(?is).*terningen er hos.*"
    timeout: 30000
- takeScreenshot: 62-opus
- extendedWaitUntil:
    visible:
      text: "(?is)(.*trill igjen.*|.*sendte videre.*|[1-6])"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 63-opus-kast
# Verten triller videre til en sekser sender terningen til appen – så triller appen selv (rett til rommet fra Swift)
- extendedWaitUntil:
    visible:
      text: "(?is).*du har terningen.*"
    timeout: 150000
- takeScreenshot: 64-opus-din-terning
- tapOn:
    text: "TRILL"
- extendedWaitUntil:
    visible:
      text: "(?is).*(trill igjen|sjekk sendte videre).*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 65-opus-du-trillet
