# Simulator-sjekken: verten (jobben) har startet Skriv og drikk og klokka – appen skriver et kort via iPhonens dialog (SkrivDrikkSkjerm.swift).
appId: no.mittvors.app
---
- extendedWaitUntil:
    visible:
      text: "(?is)vi er klare.*"
    timeout: 40000
- waitForAnimationToEnd
- tapOn:
    text: "(?is)vi er klare.*"
- waitForAnimationToEnd
- tapOn:
    text: "(?is)vi er klare.*"
    optional: true
- extendedWaitUntil:
    visible:
      text: "(?is).*skriv et kort.*"
    timeout: 20000
- takeScreenshot: 53-skriv-og-drikk
- tapOn:
    text: "(?is).*skriv et kort.*"
- waitForAnimationToEnd
- takeScreenshot: 54-skriv-dialog
- inputText: "Alle som har på seg svart drikker to"
- tapOn:
    text: "(?is).*legg i bunken.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "(?is).*kort fra deg.*"
    timeout: 15000
- takeScreenshot: 55-kort-i-bunken
