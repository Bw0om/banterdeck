# Simulator-sjekken: appen blir med i et rom som jobben har laget rett mot API-et (koden kommer som KODE).
appId: no.mittvors.app
---
- tapOn:
    id: "start-kode"
- inputText: ${KODE}
- tapOn:
    id: "start-navn"
    optional: true
- inputText: "Sjekk"
- takeScreenshot: 40-bli-med
- tapOn:
    text: "(?is)bli med.*"
- extendedWaitUntil:
    visible:
      text: "(?is).*(velger lek|starter kvelden).*"
    timeout: 30000
- takeScreenshot: 41-gjest-lobby
