# Simulator-sjekken (ios-sjekk.yml): Spill-fanen – lag et rom, åpne «Alle lekene», start Jeg har aldri, «Mer» og «Stua».
# Appen er allerede startet (simctl, på norsk). Hvert bilde havner i ios/sjekk/.
appId: no.mittvors.app
---
- takeScreenshot: 10-start
- tapOn:
    id: "start-navn"
    optional: true
- waitForAnimationToEnd
- inputText: "Sjekk"
# Tastaturet rekker ikke alltid fram før teksten skrives (navnet ble borte to ganger på rad): da prøves det én gang til
- runFlow:
    when:
      notVisible:
        text: "Sjekk"
    commands:
      # hideKeyboard feiler på iOS 26-simulatoren: trykk på ledeteksten i stedet, så feltet igjen
      - tapOn:
          text: "Navnet ditt"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          id: "start-navn"
          optional: true
      - waitForAnimationToEnd
      - inputText: "Sjekk"
# Tastaturet får stå: «Lag rom»-knappen ligger over det
- takeScreenshot: 11-start-navn
# Enter i navnefeltet lager rommet – står knappen der fortsatt, trykkes den
- tapOn:
    text: "(?is)lag rom.*"
    optional: true
# Lobbyen: oppsettene (Bli kjent, Vors …) ligger øverst, «Alle lekene» under kanten – sveip opp (scrollUntilVisible biter ikke på den native lobbyen)
- extendedWaitUntil:
    visible:
      text: "(?is)bli kjent.*"
    timeout: 30000
- takeScreenshot: 12-lobby
# Et oppsett: ett trykk setter kveldens plan («Start kvelden»), «Bytt oppsett» tar oppsettene tilbake
- tapOn:
    text: "(?is)bli kjent.*"
- extendedWaitUntil:
    visible:
      text: "(?is)start kvelden.*"
    timeout: 15000
- takeScreenshot: 12b-oppsett-valgt
- tapOn:
    text: "(?is)bytt oppsett.*"
- extendedWaitUntil:
    visible:
      text: "(?is)bli kjent.*"
    timeout: 15000
- takeScreenshot: 12c-oppsett-tilbake
- runFlow:
    when:
      notVisible:
        text: "(?is)alle lekene.*"
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 25%
          duration: 600
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "(?is)alle lekene.*"
    timeout: 10000
- tapOn:
    text: "(?is)alle lekene.*"
- extendedWaitUntil:
    visible:
      text: "Velg lek"
    timeout: 10000
- takeScreenshot: 13-velger
# Arket ned igjen, så «Mer» i lobbyen
- swipe:
    start: 50%, 30%
    end: 50%, 95%
- waitForAnimationToEnd
- takeScreenshot: 13b-lobby-igjen
# Lobbyens «Mer»-knapp (teksten under: TV, QR, bare min telefon …) – ligger den under kanten, sveipes det opp først
- runFlow:
    when:
      notVisible:
        text: "(?is)mer.*tv.*qr.*"
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 25%
          duration: 600
      - waitForAnimationToEnd
- tapOn:
    text: "(?is)mer.*tv.*qr.*"
- extendedWaitUntil:
    visible:
      text: "Lukk"
    timeout: 10000
- takeScreenshot: 14-lobby-mer
- tapOn:
    text: "Lukk"
- waitForAnimationToEnd
- takeScreenshot: 15-lobby-igjen
