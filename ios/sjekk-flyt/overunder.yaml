# Simulator-sjekken: verten (jobben) har startet Over eller under – appen ser kortet, potten og at verten gjetter; så kommer
# svaret når verten gjetter via API-et (OverUnderSkjerm.swift).
appId: no.mittvors.app
---
- extendedWaitUntil:
    visible:
      text: "(?is)vi er klare.*"
    timeout: 40000
- waitForAnimationToEnd
- tapOn:
    text: "(?is)vi er klare.*"
- waitForAnimationToEnd
- tapOn:
    text: "(?is)vi er klare.*"
    optional: true
- extendedWaitUntil:
    visible:
      text: "(?is).*i potten.*"
    timeout: 30000
- takeScreenshot: 60-over-under
- extendedWaitUntil:
    visible:
      text: "(?is).*(riktig|bommet).*"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 61-over-under-svar
# Verten hopper over gjesten, så appen har tur: appen gjetter selv (rett til rommet fra Swift) og ser at turen går videre
- extendedWaitUntil:
    visible:
      text: "(?is).*din tur.*"
    timeout: 45000
- takeScreenshot: 62-over-under-din-tur
- tapOn:
    text: "OVER"
- extendedWaitUntil:
    visible:
      text: "(?is).*vert gjetter.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 63-over-under-gjettet
