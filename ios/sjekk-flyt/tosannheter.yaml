# Simulator-sjekken: verten (jobben) har startet To sannheter og en løgn – appen (gjesten) ser stolen mens verten skriver
# (TosannheterSkjerm.swift). Kortene legges på bordet etterpå, så fristen ikke går ut før appen rekker å stemme (tosannheter2).
appId: no.mittvors.app
---
- extendedWaitUntil:
    visible:
      text: "(?is)vi er klare.*"
    timeout: 40000
- takeScreenshot: 50-to-sannheter-regler
- waitForAnimationToEnd
- tapOn:
    text: "(?is)vi er klare.*"
- waitForAnimationToEnd
- tapOn:
    text: "(?is)vi er klare.*"
    optional: true
- extendedWaitUntil:
    visible:
      text: "(?is).*i stolen.*"
    timeout: 20000
- takeScreenshot: 51-to-sannheter-venter
