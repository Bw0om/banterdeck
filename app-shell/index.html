<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mittvors</title>
<style>
  html, body { margin: 0; height: 100%; background: #FFF8EE; color: #16120F; font-family: -apple-system, system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center; }
  .merke { width: 96px; height: 96px; border-radius: 22px; background: #FFD23F; border: 4px solid #16120F; box-shadow: 5px 5px 0 #16120F; display: grid; place-items: center; font-size: 44px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  p { margin: 0; font-size: 16px; line-height: 1.4; max-width: 28ch; }
  button { font: inherit; font-weight: 800; font-size: 17px; padding: 14px 26px; border-radius: 999px; background: #FF5B1F; color: #FFF8EE; border: 3px solid #16120F; box-shadow: 4px 4px 0 #16120F; }
</style>
</head>
<body>
<main>
  <div class="merke" aria-hidden="true">🥂</div>
  <h1>Ingen nett akkurat nå</h1>
  <p>mittvors trenger nett for at alle telefonene skal henge sammen.</p>
  <button type="button" onclick="location.href='https://www.mittvors.no/no/?app=1'">Prøv igjen</button>
</main>
</body>
</html>
