# Bygger iPhone-appen i skyen (Codemagic) og sender den til TestFlight / App Store.
# Ingen Mac trengs. Oppsettet i Codemagic står i APPSTORE.md.
workflows:
  ios:
    name: iPhone-app til TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      groups:
        - app_store            # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY
      ios_signing:
        distribution_type: app_store
        bundle_identifier: no.mittvors.app
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 0   # Apple-ID-en til appen i App Store Connect (tallet under «App-informasjon»)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'app-*'
    scripts:
      - name: Pakker
        script: npm ci
      - name: Kopierer skallet inn i iOS-prosjektet
        script: npx cap sync ios
      - name: Signering
        script: |
          xcode-project use-profiles
      - name: Byggnummer
        script: |
          BUILD=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          agvtool new-version -all "$BUILD" >/dev/null || true
          cd ios/App && agvtool new-version -all "$BUILD"
      - name: Bygger
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
